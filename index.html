<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>GrantConnect</title>
  <style>
:root{--bg:#f4f7fc;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#1d4ed8;--primary2:#3b82f6;--soft:#e8efff;--border:#e2e8f0;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--radius:16px;--shadow:0 4px 18px rgba(15,23,42,.06);--nav-h:64px;--input:#fff}
[data-theme=dark]{--bg:#0b1220;--card:#111a2e;--text:#e6edf8;--muted:#94a3b8;--soft:#16264a;--border:#1f2c47;--shadow:none;--input:#0d1628;--primary:#4f8cff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,h4{margin:0 0 6px}
h1{font-size:22px}h2{font-size:18px}h3{font-size:16px}
p{margin:0 0 8px}
.muted{color:var(--muted)}small{font-size:12px}
.urgent{color:var(--bad);font-weight:600}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.stack>*+*{margin-top:14px}
.hide{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* layout */
.sidebar{display:none}
.main{padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.content{max-width:1100px;margin:0 auto}
.bottomnav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--border);display:flex;z-index:50}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;position:relative}
.nav-item.active{color:var(--primary)}
.nav-item.active svg{background:var(--soft);border-radius:10px;padding:4px;width:32px;height:28px;box-sizing:border-box}
.nav-badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;font-weight:700;padding:0 4px}
.nav-badge:empty{display:none}
@media(min-width:768px){
  .sidebar{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:232px;background:var(--card);border-right:1px solid var(--border);padding:20px 14px;z-index:40}
  .sidebar .brand{margin-bottom:22px}
  .sidebar .nav-item{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:11px 12px;border-radius:12px;margin-bottom:4px}
  .sidebar .nav-item.active{background:var(--soft)}
  .sidebar .nav-item.active svg{background:none;padding:0;width:20px;height:20px}
  .sidebar .nav-badge{position:static;margin-left:auto}
  .main{margin-left:232px;padding:28px}
  .bottomnav{display:none}
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--text)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;font-weight:800}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}

/* base components */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h3{margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}
@media(min-width:768px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--soft);color:var(--primary)}
.btn.danger{background:var(--bad)}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{background:var(--card);border:1px solid var(--border);color:var(--text);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;cursor:pointer}
.iconbtn .dotb{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;font-weight:700}
label{display:block;font-size:13px;font-weight:600;margin:0 0 5px}
.input,select,textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px 12px;font:inherit}
textarea{resize:vertical;min-height:90px}
.input:focus,select:focus,textarea:focus{outline:2px solid var(--primary2);outline-offset:0}
.field{margin-bottom:12px}
.search{position:relative}.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}.search .input{padding-left:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 14px;border-radius:99px;font-size:13px;cursor:pointer;font-weight:600}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.badge.gray{background:#e2e8f0;color:#334155}.badge.blue{background:#dbeafe;color:#1d4ed8}.badge.amber{background:#fef3c7;color:#b45309}.badge.green{background:#dcfce7;color:#15803d}.badge.red{background:#fee2e2;color:#b91c1c}
.tag{display:inline-block;background:var(--soft);color:var(--primary);font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;margin-bottom:6px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:inline-grid;place-items:center;font-weight:700;object-fit:cover;flex:none}
.avatar.lg{width:78px;height:78px;font-size:24px}.avatar.sm{width:36px;height:36px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.page-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}

/* dashboard */
.kpi{display:flex;flex-direction:column;gap:2px}.kpi b{font-size:24px}.kpi span{color:var(--muted);font-size:12px}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel .gcard{flex:0 0 82%;max-width:340px;scroll-snap-align:start}
.gcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.gcard .gbody{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.gcard h3 a{color:var(--text)}
.gcard .btn{margin-top:auto}
.cover{height:120px;display:grid;place-items:center;font-size:44px;background-size:cover;background-position:center}
.cover.big{height:180px;border-radius:var(--radius);font-size:64px;margin-bottom:14px}
.steps{display:flex;justify-content:space-between;position:relative;margin:10px 0 4px}
.steps:before{content:"";position:absolute;top:15px;left:12%;right:12%;height:3px;background:var(--border)}
.step{flex:1;text-align:center;position:relative;z-index:1;color:var(--muted)}
.step .dot{width:32px;height:32px;border-radius:50%;background:var(--border);display:grid;place-items:center;margin:0 auto 4px;font-weight:700;color:var(--muted)}
.step.done .dot{background:var(--primary);color:#fff}.step.done{color:var(--text)}
.step.bad .dot{background:var(--bad)}.step.good .dot{background:var(--ok)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa a{background:var(--soft);color:var(--primary);border-radius:14px;padding:14px 10px;text-align:center;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
@media(min-width:768px){.qa{grid-template-columns:repeat(4,1fr)}.carousel .gcard{flex-basis:300px}}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.li:last-child{border:0}
.li .ico{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--primary);display:grid;place-items:center;flex:none}
.listlink{display:block;color:inherit}

/* lists / details */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(min-width:768px){.filters{grid-template-columns:repeat(5,1fr)}}
.gl{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.gl{grid-template-columns:1fr 1fr}}@media(min-width:1000px){.gl{grid-template-columns:repeat(3,1fr)}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.fact{background:var(--soft);border-radius:12px;padding:10px 12px}.fact small{color:var(--muted);display:block}.fact b{font-size:15px}
ul.clean{margin:0;padding-left:20px}ul.clean li{margin-bottom:5px}
ol.clean{margin:0;padding-left:20px}ol.clean li{margin-bottom:6px}
.banner{padding:11px 14px;border-radius:12px;font-size:14px;margin-bottom:14px}
.banner.ok{background:#dcfce7;color:#14532d}.banner.warn{background:#fef3c7;color:#78350f}.banner.bad{background:#fee2e2;color:#7f1d1d}.banner.info{background:var(--soft);color:var(--primary)}
.timeline{position:relative;padding-left:26px}
.timeline:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl{position:relative;margin-bottom:16px}
.tl:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid var(--card)}
.tl.APPROVED:before{background:var(--ok)}.tl.REJECTED:before{background:var(--bad)}.tl.MORE_INFO_NEEDED:before,.tl.IN_REVIEW:before{background:var(--warn)}
.wizard{display:flex;gap:6px;margin-bottom:16px}
.wizard i{flex:1;height:6px;border-radius:6px;background:var(--border)}.wizard i.on{background:var(--primary)}
.docrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.docrow:last-child{border:0}
input[type=file]{font-size:13px;max-width:100%}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.toggle:last-child{border:0}
.toggle input{width:44px;height:24px;accent-color:var(--primary)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th,table.tbl td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
.scroll-x{overflow-x:auto}

/* chat */
.chat-wrap{display:grid;grid-template-columns:1fr;gap:0;height:calc(100dvh - var(--nav-h) - env(safe-area-inset-bottom) - 32px);min-height:380px}
.chat-list,.thread{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.chat-list .top{padding:12px;border-bottom:1px solid var(--border)}
.chat-list .items{overflow-y:auto;flex:1}
.citem{display:flex;gap:12px;align-items:center;padding:12px;color:inherit;border-bottom:1px solid var(--border)}
.citem.on{background:var(--soft)}
.citem .last{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px}
.ub{background:var(--primary);color:#fff;border-radius:99px;min-width:20px;height:20px;font-size:11px;display:grid;place-items:center;padding:0 6px;font-weight:700}
.thread .head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.msg{max-width:80%;padding:9px 12px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--border)}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-color:var(--primary);border-bottom-right-radius:4px}
.msg:not(.me){align-self:flex-start;border-bottom-left-radius:4px}
.msg small{display:block;opacity:.7;margin-top:3px;font-size:10px}
.msg img{max-width:100%;border-radius:10px;display:block;margin-bottom:4px}
.msg a.fl{color:inherit;text-decoration:underline}
.divider{align-self:center;font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:2px 10px;border-radius:99px;margin:6px 0}
.composer{border-top:1px solid var(--border);padding:8px;background:var(--card)}
.composer form{display:flex;gap:8px;align-items:center}
.composer .input{border-radius:99px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.attachchip{font-size:12px;background:var(--soft);color:var(--primary);padding:4px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center;margin-bottom:6px}
.info-panel{padding:10px 14px;background:var(--soft);font-size:13px;border-bottom:1px solid var(--border)}
.online{color:var(--ok)}
@media(max-width:767px){.chat-wrap.has-thread .chat-list{display:none}.chat-wrap:not(.has-thread) .thread{display:none}.hide-m{display:none}}
@media(min-width:768px){.chat-wrap{grid-template-columns:320px 1fr;gap:14px;height:calc(100dvh - 56px)}.chat-wrap:not(.has-thread) .thread{display:flex}.back-m{display:none}}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#1d4ed8 0%,#3b82f6 55%,#e8efff 55%)}
.auth .card{width:100%;max-width:420px;padding:24px}
.auth .brand{justify-content:center;margin-bottom:12px}
.demo{display:flex;gap:8px;margin-top:14px}
.demo .btn{flex:1}

/* overlay */
#overlay:empty{display:none}
#overlay{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:768px){#overlay{align-items:center}}
.modal{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
@media(min-width:768px){.modal{border-radius:20px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));background:#0f172a;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media(min-width:768px){#toast{bottom:28px}}

</style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay"></div>
  <div id="toast"></div>
  <script>
'use strict';
/* GrantConnect MVP - vanilla JS single-page app.
   Data lives in localStorage (mock backend). Session lives in sessionStorage (per tab). */

const KEY = 'grantconnect_db_v1';
const CATS = ['Education', 'Business', 'Farming', 'Health', 'Women'];
const CAT_ICON = { Education: '🎓', Business: '💼', Farming: '🌾', Health: '🩺', Women: '👩🏾‍💼' };
const CAT_BG = {
  Education: 'linear-gradient(135deg,#1d4ed8,#60a5fa)', Business: 'linear-gradient(135deg,#0f766e,#5eead4)',
  Farming: 'linear-gradient(135deg,#15803d,#86efac)', Health: 'linear-gradient(135deg,#be123c,#fda4af)',
  Women: 'linear-gradient(135deg,#7e22ce,#d8b4fe)'
};
const STATES = ['Abia','Adamawa','Akwa Ibom','Anambra','Bauchi','Bayelsa','Benue','Borno','Cross River','Delta','Ebonyi','Edo','Ekiti','Enugu','FCT Abuja','Gombe','Imo','Jigawa','Kaduna','Kano','Katsina','Kebbi','Kogi','Kwara','Lagos','Nasarawa','Niger','Ogun','Ondo','Osun','Oyo','Plateau','Rivers','Sokoto','Taraba','Yobe','Zamfara'];
const BANKS = ['Access Bank','GTBank','First Bank','UBA','Zenith Bank','Fidelity Bank','Union Bank','Stanbic IBTC','Sterling Bank','Wema Bank','Polaris Bank','Opay','Kuda','Moniepoint','PalmPay'];
const STATUS = {
  DRAFT: ['Draft', 'gray'], SUBMITTED: ['Submitted', 'blue'], IN_REVIEW: ['In Review', 'amber'],
  MORE_INFO_NEEDED: ['More info needed', 'amber'], APPROVED: ['Approved', 'green'], REJECTED: ['Rejected', 'red']
};
const MAX_FILE = 1024 * 1024; // 1MB per file (localStorage is small)

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const now = () => new Date().toISOString();
const dayOffset = n => new Date(Date.now() + n * 864e5).toISOString();
const daysLeft = d => Math.ceil((new Date(d) - Date.now()) / 864e5);
const money = n => '₦' + Number(n || 0).toLocaleString('en-NG');
const fdate = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const ftime = d => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const initials = n => (n || '?').split(' ').filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('');
function ago(d) {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}
function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return 'h' + (h >>> 0).toString(36) + s.length; } // DEMO ONLY - use argon2/bcrypt on a real backend
const badge = s => `<span class="badge ${STATUS[s][1]}">${STATUS[s][0]}</span>`;
const opts = (arr, sel, blank) => (blank !== undefined ? `<option value="">${esc(blank)}</option>` : '') + arr.map(o => `<option ${o === sel ? 'selected' : ''}>${esc(o)}</option>`).join('');

const ICONS = {
  dashboard: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  grant: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  clip: '<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>'
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------- database (localStorage) ---------- */
let db = null;
function loadDb() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.grants) return d; } catch (e) { /* ignore */ }
  const d = seed();
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* ignore */ }

function dayLabel(d) { const x = new Date(d), t = new Date(); if (x.toDateString() === t.toDateString()) return 'Today'; const y = new Date(Date.now() - 864e5); if (x.toDateString() === y.toDateString()) return 'Yesterday'; return fdate(d); }

}

function vChat(activeId, base, navKey) {

const attachChip = () => (ui.att ? `<span class="attachchip">${icon('file')} ${esc(ui.att.name)} <a href="#" data-act="rmAtt" style="color:inherit">${icon('x')}</a></span>` : '');

/* ---------- router ---------- */
const route = () => (location.hash.replace(/^#/, '') || '/').split('?')[0].split('/').filter(Boolean);
const PUBLIC = ['login', 'register', 'forgot'];
function render() {
  const u = me(), p = route(), root = $('#app');
  applyTheme();
  if (!u) { if (!PUBLIC.includes(p[0])) { location.hash = '#/login'; return; } root.innerHTML = vAuth(p[0]); return; }
  const admin = u.role === 'ADMIN', home = admin ? '#/admin' : '#/dashboard';
  if (!p.length || PUBLIC.includes(p[0]) || (admin !== (p[0] === 'admin'))) { location.hash = home; return; }
  let html = '';
  if (!admin) {
    switch (p[0]) {
      case 'dashboard': html = vDashboard(); break;
      case 'notifications': html = vNotifications(); break;
      case 'grants': html = p[1] ? vGrantDetail(p[1]) : vGrants(); break;
      case 'apply': html = vApply(p[1]); break;
      case 'applications': html = p[1] ? vAppDetail(p[1]) : vApplications(); break;
      case 'chat': html = vChat(p[1], '#/chat', 'chat'); break;
      case 'account': html = vAccount(); break;
      default: html = vNotFound();
    }
  } else {
    switch (p[1]) {
      case undefined: html = vAdminHome(); break;
      case 'grants': html = p[2] ? vGrantForm(p[3] === 'edit' ? p[2] : 'new') : vAdminGrants(); break;
      case 'applications': html = p[2] ? vAdminAppDetail(p[2]) : vAdminApps(); break;
      case 'chat': html = vChat(p[2], '#/admin/chat', 'chat'); break;
      default: html = vNotFound();
    }
  }
  if (html === '') return; // a redirect happened
  const full = location.hash;
  root.innerHTML = html;
  if (full !== ui.lastHash) { window.scrollTo(0, 0); ui.lastHash = full; }
  const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight;
  updateBadges();
}

/* ---------- forms (submit) ---------- */
const F = {
  login(f, fd) {
    const email = String(fd.get('email')).trim().toLowerCase(), u = db.users.find(x => x.email.toLowerCase() === email);
    if (!u || u.pass !== hash(String(fd.get('pass')))) { toast('Wrong email or password'); return; }
    sessionStorage.setItem('gc_uid', u.id); location.hash = u.role === 'ADMIN' ? '#/admin' : '#/dashboard'; render();
  },
  register(f, fd) {
    const email = String(fd.get('email')).trim().toLowerCase();
    if (db.users.some(x => x.email.toLowerCase() === email)) { toast('That email is already registered'); return; }
    if (fd.get('pass') !== fd.get('pass2')) { toast('Passwords do not match'); return; }
    const u = newUser({ name: String(fd.get('name')).trim(), email, phone: String(fd.get('phone')).trim(), pass: hash(String(fd.get('pass'))) });
    u.bank.accountName = u.name; db.users.push(u); ensureConvs(u); addActivity(u.id, 'Welcome to GrantConnect! Complete your profile before applying.'); save();
    sessionStorage.setItem('gc_uid', u.id); toast('Account created. Complete your profile before applying.'); location.hash = '#/account'; render();
  },
  forgot(f, fd) {
    const u = db.users.find(x => x.email.toLowerCase() === String(fd.get('email')).trim().toLowerCase());
    if (!u) { toast('No account with that email'); return; }
    u.pass = hash(String(fd.get('pass'))); save(); toast('Password reset. Please log in.'); location.hash = '#/login';
  },
  dashSearch(f, fd) { ui.gf = { q: String(fd.get('q')).trim(), cat: 'All', loc: '', sort: 'newest', min: '', elig: '' }; location.hash = '#/grants'; render(); },
  applyStep(f, fd) {
    const u = me(), a = ui.draft, g = gid(a.grantId), steps = stepsFor(g), s = fd.get('__step');
    if (s === 'personal') a.personal = { fullName: fd.get('fullName'), phone: fd.get('phone'), dob: fd.get('dob'), address: fd.get('address'), state: fd.get('state') };
    if (s === 'bank') a.bank = { bankName: fd.get('bankName'), accountNumber: fd.get('accountNumber'), accountName: fd.get('accountName') };
    if (s === 'questions') g.fields.forEach(x => { a.answers[x.id] = x.type === 'checkbox' ? (fd.get(x.id) ? 'Yes' : 'No') : String(fd.get(x.id) || ''); });
    if (s === 'documents') { const miss = g.requiredDocs.filter(r => !a.docs.find(d => d.req === r)); if (miss.length) { toast('Upload: ' + miss[0]); return; } }
    if (s === 'review') {
      const miss = g.requiredDocs.filter(r => !a.docs.find(d => d.req === r)); if (miss.length) { toast('Missing document: ' + miss[0]); return; }
      const resub = a.status === 'MORE_INFO_NEEDED';
      a.status = 'SUBMITTED'; a.submittedAt = now(); a.history.push({ status: 'SUBMITTED', at: now(), note: resub ? 'Application updated and resubmitted' : 'Application submitted' });
      addActivity(u.id, `You applied for ${g.title}`); persistDraft(a); ui.draft = null; toast('Application submitted!'); location.hash = '#/applications/' + a.id; render(); return;
    }
    persistDraft(a); ui.step = Math.min(steps.length - 1, ui.step + 1); render();
  },
  chatSend(f, fd) {
    const u = me(), c = convsFor(u).find(x => x.id === fd.get('cid')), text = String(fd.get('text')).trim();
    if (!c || (!text && !ui.att)) return;
    c.messages.push({ id: uid('m'), from: viewerRole(u), text, att: ui.att || undefined, at: now(), read: false });
    ui.att = null; f.reset(); save(); refreshChat();
    if (u.role !== 'ADMIN') autoReply(c.id, text);
  },
  profile(f, fd) { const u = me(); u.name = String(fd.get('name')).trim(); u.phone = String(fd.get('phone')).trim(); save(); render(); toast('Profile saved'); },
  personal(f, fd) {
    const u = me(); ['dob', 'gender', 'state', 'country', 'address', 'interest'].forEach(k => { u[k] = String(fd.get(k) || ''); });
    const id = String(fd.get('idNumber') || '').trim(); if (id) u.idNumber = id; // real backend: encrypt at rest
    save(); render(); toast('Personal info saved');
  },
  bank(f, fd) { me().bank = { bankName: fd.get('bankName'), accountNumber: fd.get('accountNumber'), accountName: fd.get('accountName') }; save(); toast('Bank details saved'); },
  docUpload(f, fd) {
    const file = fd.get('file'), kind = fd.get('kind');
    readFile(file, d => { me().docs.push({ id: uid('d'), kind, name: d.name, dataUrl: d.dataUrl, at: now() }); if (save()) { render(); toast('Document uploaded'); } });
  },
  password(f, fd) {
    const u = me(); if (u.pass !== hash(String(fd.get('cur')))) { toast('Current password is wrong'); return; }
    u.pass = hash(String(fd.get('pass'))); save(); f.reset(); toast('Password changed');
  },
  grantSave(f, fd) {
    const lines = k => String(fd.get(k) || '').split('\n').map(x => x.trim()).filter(Boolean);
    const id = fd.get('id'), old = id ? gid(id) : null, TYPES = ['text', 'textarea', 'number', 'date', 'select', 'checkbox'];
    const fields = lines('fields').map((l, i) => {
      const p = l.split('|').map(x => x.trim()), prev = old && old.fields.find(x => x.label === p[0]);
      return { id: prev ? prev.id : uid('f'), label: p[0], type: TYPES.includes((p[1] || '').toLowerCase()) ? p[1].toLowerCase() : 'text', required: (p[2] || 'required').toLowerCase() !== 'optional', options: p[3] ? p[3].split(',').map(x => x.trim()).filter(Boolean) : [] };
    });
    const states = String(fd.get('states') || '').split(',').map(x => x.trim()).filter(Boolean);
    const g = Object.assign(old || { id: uid('g'), createdAt: now(), awards: null }, {
      title: fd.get('title'), org: fd.get('org'), category: fd.get('category'), amount: +fd.get('amount'), deadline: new Date(fd.get('deadline') + 'T23:59:00').toISOString(),
      eligibility: fd.get('eligibility'), eligibleStates: states, location: states.length === 1 ? states[0] : states.length ? 'Multiple states' : 'Nationwide', coverUrl: fd.get('coverUrl') || '', desc: fd.get('desc'),
      criteria: lines('criteria'), requiredDocs: lines('requiredDocs'), steps: lines('steps'), fields, featured: !!fd.get('featured'), status: fd.get('status')
    });
    if (!old) db.grants.push(g); save(); toast('Grant saved'); location.hash = '#/admin/grants';
  }
};

/* ---------- input / change handlers ---------- */
const I = {
  gf(el) { ui.gf[el.dataset.key] = el.value; const l = $('#glist'); if (l) l.innerHTML = gListHtml(); },
  chatSearch(el) { ui.chatQ = el.value; const l = $('#chatlist'); const u = me(); if (l) { const p = route(); l.innerHTML = chatListHtml(u, p[p.length - 1], u.role === 'ADMIN' ? '#/admin/chat' : '#/chat'); } }
};
const C = {
  gf(el) { I.gf(el); },
  theme(el) { localStorage.setItem('gc_theme', el.value); applyTheme(); },
  notif(el) { me().notif[el.dataset.key] = el.checked; save(); toast('Notification settings saved'); },
  photo(el) { readFile(el.files[0], d => { me().photo = d.dataUrl; if (save()) { render(); toast('Photo updated'); } }); },
  docReplace(el) { readFile(el.files[0], d => { const doc = me().docs.find(x => x.id === el.dataset.id); Object.assign(doc, { name: d.name, dataUrl: d.dataUrl, at: now() }); if (save()) { render(); toast('Document replaced'); } }); },
  applyDoc(el) { const a = ui.draft; readFile(el.files[0], d => { a.docs = a.docs.filter(x => x.req !== el.dataset.req).concat({ req: el.dataset.req, name: d.name, dataUrl: d.dataUrl, type: d.type }); persistDraft(a); render(); toast('Uploaded'); }); },
  chatAttach(el) { readFile(el.files[0], d => { ui.att = d; const ac = $('#attachchip'); if (ac) ac.innerHTML = attachChip(); }); }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) { if (e.target.id === 'overlay') closeModal(); return; }
  const fn = A[t.dataset.act]; if (fn) fn(t, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const fn = F[f.dataset.form]; if (fn) fn(f, new FormData(f));
});
document.addEventListener('input', e => { const t = e.target.closest('[data-input]'); if (t && I[t.dataset.input]) I[t.dataset.input](t); });
document.addEventListener('change', e => { const t = e.target.closest('[data-change]'); if (t && C[t.dataset.change]) C[t.dataset.change](t); });
window.addEventListener('hashchange', render);
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  db = loadDb();
  if (ui.draft && ui.draft.id) { const x = db.apps.find(a => a.id === ui.draft.id); if (x) ui.draft = x; }
  const p = route(); const u = me();
  if (!u) return;
  if (p[p.length - 2] === 'chat' || p[p.length - 1] === 'chat') { refreshChat(); return; }
  updateBadges();
  const live = ['dashboard', 'applications', 'notifications'];
  if (live.includes(p[0]) || (p[0] === 'admin' && (!p[1] || (p[1] === 'applications' && !p[2])))) render();
});
if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { /* ignore */ } }
if (!location.hash) location.hash = '#/login';
render();

</script>
</body>
</html>
